# ─── Sync OpenAPI Spec ────────────────────────────────────────────────────────
# Fetches the latest OpenAPI 3.0.1 spec from the dynamic endpoint at
# api.chatvolt.ai and commits any changes to the local openapi.yaml.
#
# This replaces manual maintenance of 12 static YAMLs (~7,950 lines) with
# a single auto-generated spec that reflects the actual API routes.
#
# Runs:
#   - Daily at 06:00 UTC (spec may drift as the dashboard evolves)
#   - On every push to main (catches deploy-time changes)
#   - Manually via workflow_dispatch (for immediate sync)
# ──────────────────────────────────────────────────────────────────────────────

name: "Sync OpenAPI Spec"

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-openapi.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest OpenAPI spec from api.chatvolt.ai
        run: |
          # Try the direct API route first, then fall back to aliases
          curl -sSf https://api.chatvolt.ai/api/docs/openai.yaml -o openapi.yaml.new \
            || curl -sSf https://api.chatvolt.ai/openapi.yaml -o openapi.yaml.new \
            || curl -sSf https://api.chatvolt.ai/docs/openai.yaml -o openapi.yaml.new

      - name: Check for changes
        id: diff
        run: |
          if [ ! -f openapi.yaml ] || ! diff -q openapi.yaml openapi.yaml.new > /dev/null 2>&1; then
            mv openapi.yaml.new openapi.yaml
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            rm openapi.yaml.new
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "chatvolt-bot"
          git config user.email "bot@chatvolt.ai"
          git add openapi.yaml
          git commit -m "chore: sync OpenAPI spec from api.chatvolt.ai [skip ci]"
          git push
