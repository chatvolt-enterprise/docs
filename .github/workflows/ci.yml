# ─── CI — Validate Docs ───────────────────────────────────────────────────────
# Validates the documentation site on every push/PR to main.
# Runs: install deps → validate structure → check broken links
# ──────────────────────────────────────────────────────────────────────────────

name: "CI — Validate Docs"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Mintlify docs
        run: npx mint validate

      - name: Check broken links
        run: npx mint broken-links
