          format: uuid
    DispatchPayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Include the ID to update an existing dispatch. Omit to create
            a new one.
        name:
          type: string
          description: The name of the dispatch.
        status:
          type: string
          description: The status of the dispatch (e.g., 'draft', 'scheduled', 'sent').
        agentId:
          type: string
          format: uuid
          description: The ID of the agent responsible for the dispatch.
        crmScenarioId:
          type: string
          format: uuid
          nullable: true
          description: The ID of the CRM scenario associated with the dispatch.
        crmStepId:
          type: string
          format: uuid
          nullable: true
          description: The ID of the CRM step associated with the dispatch.
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: The date and time the dispatch is scheduled to run.
        templateMessage:
          type: string
          nullable: true
          description: The message template for the dispatch.
        interval:
          type: integer
          nullable: true
          description: The interval in minutes between sending messages for the dispatch.
        defaultAssigneeId:
          type: string
          format: uuid
          nullable: true
          description: The ID of the default assignee for conversations created by
            this dispatch.
        defaultStatus:
          type: string
          nullable: true
          description: The default status for conversations created by this dispatch.
        contactListIds:
          type: array
          items:
            type: string
            format: uuid
          description: An array of contact list IDs to associate with the dispatch.
        exclusionContactListIds:
          type: array
          items:
            type: string
            format: uuid
          description: An array of contact list IDs to exclude from the dispatch.
    FollowUpMessagesToolConfig:
      type: object
      properties:
        max_sends:
          type: integer
          minimum: 1
          maximum: 10
          description: The maximum number of follow-up messages to send.
        interval_hours:
          type: integer
          minimum: 1
          maximum: 96
          description: The interval in hours between each follow-up message.
        messages:
          type: string
          maxLength: 1000
          description: The content of the follow-up messages, separated by `||`.
    HttpToolConfig:
      type: object
      properties:
        name:
          type: string
          description: A unique and descriptive name for the tool, used to identify
            it during agent execution.
        description:
          type: string
          description: A detailed description of what the tool does. This is used
            by the agent to decide when to use this tool.
        url:
          type: string
          format: url
          description: The endpoint URL for the HTTP request. Can include path variables
            in the format `:variable_name`.
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          description: The HTTP method for the request.
        withApproval:
          type: boolean
          description: If true, the agent will require user approval before executing
            the request. Defaults to false.
        headers:
          type: array
          description: Key-value pairs for the request headers.
          items:
            $ref: '#/components/schemas/ToolKeyValueField'
        body:
          type: array
          description: Key-value pairs for the request body, typically used for `application/x-www-form-urlencoded`
            or `multipart/form-data`.
          items:
            $ref: '#/components/schemas/ToolKeyValueField'
        rawBody:
          type: string
          description: A raw JSON string for the request body. Used for `application/json`
            content type. This is mutually exclusive with `body`.
        queryParameters:
          type: array
          description: Key-value pairs for the URL query parameters.
          items:
            $ref: '#/components/schemas/ToolKeyValueField'
        pathVariables:
          type: array
          description: Key-value pairs for variables in the URL path. E.g., if URL
            is `/users/:userId`, a path variable with key `userId` should be defined.
          items:
            $ref: '#/components/schemas/ToolKeyValueField'
        hasMaximumToolCalls:
          type: boolean
          description: If true, limits the number of times the tool can be called
            in a conversation. Defaults to false.
        maximumToolCalls:
          type: integer
          description: The maximum number of calls allowed. Defaults to 1 if hasMaximumToolCalls
            is true.
        isErrorCountable:
          type: boolean
          description: If true, failed calls count towards the maximumToolCalls limit.
            Defaults to true if hasMaximumToolCalls is true.
    LinkDispatchToListPayload:
      type: object
      properties:
        dispatchId:
          type: string
          format: uuid
        contactListId:
          type: string
          format: uuid
        isExcluded:
          type: boolean
          description: Set to true to exclude this list from the dispatch.
