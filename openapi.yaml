components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        handle:
          type: string
          description: A unique identifier (slug) for the agent.
          nullable: true
        modelName:
          type: string
          description: LLM - Model name.
        temperature:
          type: number
          description: Temperature of the model (min 0.0, max 1.0)
        visibility:
          type: string
          enum:
          - public
          - private
        systemPrompt:
          type: string
          description: Agent system prompt
          nullable: true
        enableInactiveHours:
          type: boolean
          nullable: true
          description: Enable or disable Inactive hours for the agent.
        inactiveHours:
          type: object
          nullable: true
          description: A JSON object specifying the agent's inactive hours per channel.
            The top-level keys represent the channel (e.g., `whatsapp`, `website`,`instagram`),
            and each key contains an object with the days of the week and their respective
            inactive time ranges.
          example:
            whatsapp:
              monday:
              - from: 00:00
                to: 08:00
              - from: '18:00'
                to: '23:59'
              saturday:
              - from: '12:00'
                to: '23:59'
            website:
              saturday:
              - from: 00:00
                to: '23:59'
              sunday:
              - from: 00:00
                to: '23:59'
        interfaceConfig:
          type: object
          additionalProperties: true
          description: Chat interface settings for this agent.
        configUrlExternal:
          type: object
          description: External URL configurations.
          properties:
            url:
              type: string
            header:
              type: string
        configUrlInfosSystemExternal:
          type: object
          description: External URL configurations of the system.
          properties:
            url_webhook_external:
              type: string
            headerKey:
              type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: List of tools associated with the agent.
        organizationId:
          type: string
          description: ID of the organization the agent belongs to.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the agent was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to the agent.
    AgentBlacklistEntry:
      type: object
      properties:
        id:
          type: string
          description: The ID of the blacklist entry.
        agentId:
          type: string
          description: The ID of the agent.
        userIdentify:
          type: string
          description: The identifier for the blacklisted user (e.g., email, phone
            number, IP address).
        organizationId:
          type: string
          description: The ID of the organization.
        agent:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            iconUrl:
              type: string
              nullable: true
      required:
      - id
      - agentId
      - userIdentify
      - organizationId
    AgentWhitelistEntry:
      type: object
      properties:
        agentId:
          type: string
          description: The ID of the agent.
        whatsappNumber:
          type: string
          description: The whitelisted WhatsApp number.
      required:
      - agentId
      - whatsappNumber
    AlterStepResult:
      type: object
      description: The result of an operation that alters a conversation's step in
        a CRM scenario.
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        newStepId:
          type: string
          format: cuid
          nullable: true
        messageSent:
          type: boolean
          nullable: true
        sendMessageError:
          type: string
          nullable: true
        sentMessageId:
          type: string
          format: cuid
          nullable: true
        initialMessage:
          type: string
          nullable: true
        stepAgentId:
          type: string
          format: cuid
          nullable: true
        blockedBy24hRule:
          type: boolean
          nullable: true
        zapiAgentId:
          type: string
          format: cuid
          nullable: true
        zapiPhoneNumber:
          type: string
          nullable: true
        zapiMessage:
          type: string
          nullable: true
    Artifact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        externalUrl:
          type: string
          nullable: true
        customJson:
          type: object
          nullable: true
        categoryId:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMedia'
        category:
          $ref: '#/components/schemas/ArtifactCategory'
    ArtifactCategory:
