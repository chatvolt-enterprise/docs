  /twilio/{ownerPhone}/{contactPhone}/message:
    post:
      tags:
      - twilio
      summary: Sends a SMS message through the Twilio integration.
      description: 'This endpoint allows sending a text message to a destination phone
        number, using a configured Twilio instance.

        The message is also registered in the conversation associated with the agent
        and contact.'
      parameters:
      - in: path
        name: ownerPhone
        required: true
        schema:
          type: string
        description: The Twilio phone number that owns the integration.
      - in: path
        name: contactPhone
        required: true
        schema:
          type: string
        description: Recipient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Textual content of the message.
      responses:
        '200':
          description: Message sent and registered successfully. Returns the message
            object created in the system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request (e.g., missing `instanceId`, `contactPhone`
            in the path, or `message`/`attachments` missing in the body).
        '402':
          description: Premium functionality. The organization does not have an active
            subscription.
        '403':
          description: Unauthorized (e.g., invalid API key, or agent does not belong
            to the session's organization).
        '404':
          description: Resource not found (e.g., Twilio instance not found, agent
            not found, or invalid `contactPhone`).
  /variables:
    post:
