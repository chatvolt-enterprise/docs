  /conversations/{conversationId}/assign:
    post:
      tags:
      - conversations
      summary: Assigns a conversation to a user (agent).
      description: Associates a user with a specific conversation. If the conversation
        is already assigned to another user, the request will fail with a 409 Conflict,
        unless the 'force' parameter is set to true.
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
        description: ID of the conversation to be assigned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the user to whom the conversation will be
                    assigned.
                id:
                  type: string
                  description: ID of the user to whom the conversation will be assigned.
                membershipId:
                  type: string
                  description: ID of the membership to whom the conversation will
                    be assigned.
                force:
                  type: boolean
                  description: If true, forces the assignment even if the conversation
                    is already assigned to another user.
              oneOf:
              - required:
                - email
              - required:
                - id
              - required:
                - membershipId
      responses:
        '200':
          description: Conversation assigned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Conversation Assigned.
        '400':
          description: Invalid request (e.g., missing `conversationId` in the path,
            or `email` missing in the body).
        '403':
          description: Unauthorized (e.g., user trying to assign a conversation from
            another organization, or the email user does not belong to the conversation's
            organization).
        '404':
          description: Conversation not found with the provided ID, or user not found
            with the provided email.
