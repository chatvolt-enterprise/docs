                  type: string
                  description: Textual content of the data source (used for `file`
                    and `qa` types when `isUpdateText` is true).
                type:
                  type: string
                  enum:
                  - file
                  - qa
                  - web_page
                  - web_site
                id:
                  type: string
                  description: Optional ID of the existing datasource for update (upsert).
