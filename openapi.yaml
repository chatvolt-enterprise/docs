          format: date-time
          nullable: true
        templateMessage:
          type: string
          nullable: true
        interval:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalCount:
          type: integer
        sentCount:
          type: integer
