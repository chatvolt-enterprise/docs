  /contacts/variables:
    get:
      tags:
      - contact-variables
      summary: Get Contact Variables
      description: 'Returns all custom variables stored for a contact.


        The `id` parameter is flexible — it can be a **contact ID** or a **conversation
        ID**

        (the first participant contact will be resolved automatically). If omitted
        or unresolvable,

        the executor falls back to the `conversationid` request header injected by
        the AI HTTP-tool

        runner.

        '
      parameters:
      - in: query
        name: id
        required: false
        schema:
          type: string
        description: Contact ID or Conversation ID. Required unless the `conversationid`
          request header is present.
      responses:
        '200':
          description: Contact variables retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    $ref: '#/components/schemas/ContactVariables'
                  variableList:
                    type: array
                    description: Formatted list of variables with source tracking.
                    items:
                      $ref: '#/components/schemas/ContactVariableItem'
        '400':
          description: Contact ID is required.
        '403':
          description: Unauthorized.
        '404':
          description: Contact not found.
    post:
      tags:
      - contact-variables
      summary: Create or Update a Contact Variable
      description: 'Creates a new variable for a contact, or updates its value if
        the key already exists (upsert).


        The operation is **atomic** — uses a PostgreSQL JSONB merge so concurrent
        writes to different

        keys never overwrite each other.


        The `id` field is optional when the request is made by the AI via HTTP tools
        and the

        `conversationid` header is present.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Contact ID or Conversation ID. Optional if the `conversationid`
                    header is set.
                key:
                  type: string
                  minLength: 1
                  description: Variable name (key). Must not start with `_`.
                value:
                  description: Variable value. Accepts any JSON type (string, number,
                    boolean, object, array, null).
                source:
                  type: string
                  enum:
                  - human
                  - ai
                  description: Origin of the variable — `human` for manual input,
                    `ai` for AI-generated.
              required:
              - key
              - value
              - source
            example:
              id: contact_abc123
              key: plano
              value: pro
              source: human
      responses:
        '200':
          description: Variable created or updated. Returns the full updated variables
            object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    $ref: '#/components/schemas/ContactVariables'
        '400':
          description: Invalid request body.
        '403':
          description: Unauthorized.
        '404':
          description: Contact not found.
    put:
      tags:
      - contact-variables
      summary: Update a Contact Variable
      description: 'Updates an existing contact variable. Functionally identical to
        `POST` (atomic upsert),

        provided as a separate verb for semantic clarity when the intent is to update.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Contact ID or Conversation ID. Optional if the `conversationid`
                    header is set.
                key:
                  type: string
                  minLength: 1
                  description: Variable name (key).
                value:
                  description: New variable value. Accepts any JSON type.
                source:
                  type: string
                  enum:
                  - human
                  - ai
                  description: Origin of the value.
              required:
              - key
              - value
              - source
            example:
              id: contact_abc123
              key: plano
              value: enterprise
              source: human
      responses:
        '200':
          description: Variable updated. Returns the full updated variables object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    $ref: '#/components/schemas/ContactVariables'
        '400':
          description: Invalid request body.
        '403':
          description: Unauthorized.
        '404':
          description: Contact not found.
    delete:
      tags:
      - contact-variables
      summary: Delete a Contact Variable
      description: 'Removes a specific variable key from a contact, or all variables
        if `key` is omitted.


        - **With `key`**: atomically removes that key and its `_sources` entry. Returns
        `404` if the key does not exist.

        - **Without `key`**: deletes the entire `contact_variables` record for the
        contact.

        '
      parameters:
      - in: query
        name: id
        required: true
        schema:
          type: string
        description: Contact ID or Conversation ID.
      - in: query
        name: key
        required: false
        schema:
          type: string
        description: Variable key to remove. Omit to delete all variables for the
          contact.
      responses:
        '200':
          description: Variable(s) deleted. Returns the current variables state after
            deletion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    $ref: '#/components/schemas/ContactVariables'
        '403':
          description: Unauthorized.
        '404':
          description: Variable key not found (only when `key` is specified).
