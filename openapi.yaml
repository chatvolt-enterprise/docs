          for conversations not assigned to any agent. Optional.
      - in: query
        name: channel
        schema:
          type: string
        description: Channel filter. Optional.
      - in: query
        name: createdAt
        schema:
          type: string
          format: date-time
        description: Filters conversations created from this date/time (inclusive).
          Accepted formats include 'YYYY-MM-DD HH:mm:ss', 'YYYY-MM-DD HH:mm', 'YYYY-MM-DD',
          or a complete ISO 8601 format. Optional.
      - in: query
        name: endDate
        schema:
          type: string
          format: date-time
        description: Filters conversations created until this date/time (inclusive).
          Accepted formats include 'YYYY-MM-DD HH:mm:ss' or complete ISO 8601 format.
          Optional.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - RESOLVED
          - UNRESOLVED
          - HUMAN_REQUESTED
        description: Filters conversations by status. Optional.
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        description: Filters conversations by priority. Optional.
      - in: query
        name: assigneeId
        schema:
          type: string
        description: Filters by the assigned membership ID, or 'unassigned' for conversations
          without assignees. Optional.
      - in: query
        name: unread
        schema:
          type: boolean
        description: If true, filters only conversations that have unread messages.
          Optional.
      - in: query
        name: tag
        schema:
          type: string
        description: Filters conversations by a specific tag. Optional.
      - in: query
        name: ai
        schema:
          type: string
          enum:
          - enabled
          - disabled
        description: Filters conversations based on their AI enabled state. Optional.
      - in: query
        name: adSourceId
        schema:
          type: string
        description: Filters conversations originating from a specific Meta Ad source
          ID. Optional.
      - in: query
        name: crmScenarioId
        schema:
          type: string
        description: Filters conversations that are active in a specific CRM scenario.
          Optional.
      - in: query
        name: crmStepId
        schema:
          type: string
        description: Filters conversations that are active in a specific CRM step.
          Must be used with crmScenarioId. Optional.
      - in: query
        name: frustrationMin
        schema:
          type: number
        description: Minimum frustration score (0 to 1). Optional.
      - in: query
        name: frustrationMax
        schema:
          type: number
        description: Maximum frustration score (0 to 1). Optional.
      - in: query
        name: npsStep
        schema:
          type: integer
        description: Filters conversations by their current NPS step. Optional.
      - in: query
        name: npsRating
        schema:
          type: integer
        description: Filters conversations by exact NPS rating score. Optional.
      - in: query
        name: npsRatingMin
        schema:
          type: integer
        description: Filters conversations with an NPS rating score greater than or
          equal to this value. Optional.
      - in: query
        name: npsRatingMax
        schema:
          type: integer
        description: Filters conversations with an NPS rating score less than or equal
          to this value. Optional.
      - in: query
        name: npsCompleted
        schema:
          type: boolean
        description: Filters conversations by NPS completion state. Optional.
      - in: query
        name: limit
        schema:
          type: integer
          default: 25
          maximum: 100
        description: Number of conversations to return (maximum 100, defaults to 25).
          Optional.
      - in: query
        name: cursor
        schema:
          type: string
        description: Cursor for pagination. A URL-safe JSON string containing `lastCreatedAt`
          and `lastId` (e.g. `{"lastCreatedAt":"2026-06-08T15:00:00.000Z","lastId":"some-id"}`).
          Optional.
      responses:
        '200':
          description: A list of conversations that match the filter criteria, capped
            by the `limit` parameter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationDetailed'
        '400':
          description: Invalid query parameters (e.g., invalid date format for `createdAt`,
            or invalid `status` value).
        '403':
          description: Unauthorized.
  /conversation/message/{type}/{value}:
    post:
      tags:
      - conversations
      summary: Allows an agent to send a message to any conversation, following the
        rules of its parameters.
      description: Allows an agent to send a message to a conversation, identified
        by ID, phone, or email.
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - conversationId
          - phone
          - email
        description: Type of conversation identifier. It can be "conversationId" for
          the conversation ID, "phone" for the phone number, or "email" for the email
          address.
      - in: path
        name: value
        required: true
        schema:
          type: string
        description: Value corresponding to the identifier type specified in "type".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Content of the message to be sent.
                agentId:
                  type: string
                  description: (Optional) Agent ID, in cuid format.
                channel:
                  type: string
                  enum:
                  - website
                  - dashboard
                  - whatsapp
                  - zapi
                  - telegram
                  - instagramDm
                  description: (Optional) Channel used to send the message.
                attachments:
                  type: array
                  description: (Optional) List of attachments to be sent.
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        description: Attachment URL.
                      name:
                        type: string
                        description: Attachment name.
                      mimeType:
                        type: string
                        description: MIME type of the attachment.
                visitorId:
                  type: string
                  description: (Optional) Visitor ID, if applicable.
                contactId:
                  type: string
                  description: (Optional) Contact ID, if applicable.
              required:
              - message
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request. This can occur if `type` is not `conversationId`
            and `agentId` or `channel` are missing, or if the request body is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: INVALID_REQUEST
        '403':
          description: Unauthorized (e.g., session organization not found).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: UNAUTHORIZED
        '404':
          description: Conversation not found with the provided identifiers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: NOT FOUND
        '406':
          description: Session expired. The 24-hour limit for responding via API (for
            channels like WhatsApp/Instagram DM) has been exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: ERR_META_SESSION_EXPIRED_24H
        '500':
          description: Server error. Occurs when no conversation is found based on
            the provided parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No Conversation found
