  /artifacts/search:
    get:
      tags:
      - artifacts
      summary: Search Artifacts
      description: 'Search for artifacts with advanced filters.

        **Logic Notes:**

        - If `ids` is provided, `q` is ignored.

        - `categoryIds` searches recursively (includes children categories).

        - Arrays (`ids`, `categoryIds`, `mediaTypes`) accept comma-separated strings.

        '
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search term for name, description, or category name. Ignored
          if `ids` is present.
      - in: query
        name: ids
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        description: List of specific Artifact IDs (e.g., `id1,id2`). Overrides textual
          search.
      - in: query
        name: minPrice
        schema:
          type: number
        description: Minimum price filter.
      - in: query
        name: maxPrice
        schema:
          type: number
        description: Maximum price filter.
      - in: query
        name: categoryIds
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        description: List of category IDs. Includes sub-categories automatically.
      - in: query
        name: mediaTypes
        schema:
          type: array
          items:
            type: string
            enum:
            - IMAGE
            - VIDEO
            - AUDIO
            - DOCUMENT
            - OTHER
        style: form
        explode: false
        description: Filter by media types (e.g., `IMAGE,VIDEO`).
      - in: query
        name: maxMedias
        schema:
          type: integer
          default: 10
          maximum: 50
        description: Max number of media items to return per artifact.
      - in: query
        name: includeInactive
        schema:
          type: boolean
          default: false
        description: If true, returns inactive artifacts as well.
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
        description: Pagination limit.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Pagination page number.
      responses:
        '200':
          description: Successful search response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
                      maxMedias:
                        type: integer
