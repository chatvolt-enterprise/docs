  /crm/step/conversation:
    post:
      tags:
      - CRM Steps
      summary: Add Conversation to CRM Step
      description: 'Adds an existing conversation to a specific CRM step within a
        scenario.

        The step can be identified by `stepId`, or by `scenarioId` and `stepIndex`.

        If only `scenarioId` is provided, the conversation is added to the first step
        of that scenario.

        This action also creates an initial `CrmConversationLog` with ''active'' status.

        If the conversation is already part of other scenarios, those associations
        will be marked as unavailable.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: cuid
                  description: ID of the conversation to add to the step.
                scenarioId:
                  type: string
                  format: cuid
                  description: ID of the CRM scenario. Required if `stepId` is not
                    provided or if `stepIndex` is used.
                stepId:
                  type: string
                  format: cuid
                  nullable: true
                  description: ID of the specific CRM step. If provided, `scenarioId`
                    and `stepIndex` are ignored for step identification.
                stepIndex:
                  type: integer
                  nullable: true
                  description: Index of the step within the scenario (used with `scenarioId`
                    if `stepId` is not provided).
              required:
              - conversationId
      responses:
        '200':
          description: The result of the operation to add the conversation to the
            step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlterStepResult'
        '400':
          description: Invalid request (e.g., missing required IDs, invalid combination,
            or other processing error).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    description: A description of the error.
                  blockedBy24hRule:
                    type: boolean
                    nullable: true
                    description: Indicates if the action was blocked by the 24-hour
                      rule.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden (e.g., user does not have a paid plan).
        '404':
          description: Not found (e.g., conversation, scenario, or step not found).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    description: A description of the error.
                  blockedBy24hRule:
                    type: boolean
                    nullable: true
                    description: Indicates if the action was blocked by the 24-hour
                      rule.
        '409':
          description: Conflict (e.g., conversation already exists in this scenario).
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    description: A description of the error.
                  blockedBy24hRule:
                    type: boolean
                    nullable: true
                    description: Indicates if the action was blocked by the 24-hour
                      rule.
      security:
      - bearerAuth: []
  /crm/step/move:
    post:
      tags:
      - CRM Steps
      summary: Move Conversation to Another CRM Step
      description: 'Moves a conversation to a specified destination step within a
        CRM scenario.

        The destination step can be identified by `destStepId` or by `scenarioId`
        and `destStepIndex`.

        Optionally, an initial message for the destination step can be sent.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: cuid
                  description: ID of the conversation to move.
                scenarioId:
                  type: string
                  format: cuid
                  nullable: true
                  description: ID of the CRM scenario. Required if `destStepId` is
                    not provided or to specify context for `destStepIndex`.
                destStepId:
                  type: string
                  format: cuid
                  nullable: true
                  description: ID of the destination CRM step. If provided, `scenarioId`
                    (if also provided) must match the step's scenario.
                destStepIndex:
                  type: integer
                  nullable: true
                  description: Index of the destination step within the scenario (used
                    with `scenarioId` if `destStepId` is not provided).
                shouldSendInitialMessage:
                  type: boolean
                  default: false
                  description: Whether to send the initial message of the destination
                    step.
              required:
              - conversationId
      responses:
        '200':
          description: Conversation moved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Conversation moved to step X and initial message sent.
                  newStepId:
                    type: string
                    format: cuid
                    description: The ID of the new step the conversation was moved
                      to.
                  messageSent:
                    type: boolean
                    nullable: true
                    description: Indicates if the initial message of the new step
                      was sent.
                  messageError:
                    type: string
                    nullable: true
                    description: Error message if sending the initial message failed.
                  sentMessageId:
                    type: string
                    format: cuid
                    nullable: true
                    description: The ID of the message that was sent (if any).
                  blockedBy24hRule:
                    type: boolean
                    nullable: true
                    description: Indicates if sending a message was blocked by the
                      24-hour rule (e.g., for WhatsApp).
        '400':
          description: Invalid request (e.g., missing required IDs, invalid combination,
            or could not determine destination step).
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden (e.g., user does not have a paid plan).
        '404':
          description: Not found (e.g., conversation, scenario, or destination step
            not found).
        '500':
          description: Internal server error during step movement processing.
      security:
      - bearerAuth: []
  /datasources:
    post:
      tags:
      - datasources
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                fileName:
                  type: string
                  description: Optional name for the uploaded file. If not provided,
                    the original file name will be used.
                type:
                  type: string
                  enum:
                  - file
                datastoreId:
                  type: string
                custom_id:
                  type: string
                  description: Optional custom ID, useful for multi-tenant configurations
                    to filter data later.
              required:
              - type
              - datastoreId
              - file
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
